name: Build for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://cysjsmvtxfgjtdbvblnz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_LHdMoxK3ExSYIHiD6RKL_Q_SAIOkPvp
          VITE_CALENDLY_URL: https://calendly.com/wellydebest
          VITE_EMAIL_CODES_READY: 'true'
          VITE_GOOGLE_AUTH_READY: 'true'
          VITE_PHONE_AUTH_READY: 'false'
      - name: Record build version
        run: printf '%s\n' "$GITHUB_SHA" > dist/build-version.txt
      - name: Add page routing
        run: |
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteRule ^(services|gallery)/?$ /index.html [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>
          EOF
      - name: Publish built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build from ${GITHUB_SHA}"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force https://github.com/${GITHUB_REPOSITORY}.git HEAD:refs/heads/hostinger-published

